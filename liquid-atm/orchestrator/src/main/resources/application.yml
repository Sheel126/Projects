spring:
  application:
    name: liquid-atm-orchestrator
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/liquidatm}
    username: ${DATABASE_USER:liquidatm}
    password: ${DATABASE_PASSWORD:change-me}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always
